<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c1029">
  <meta name="color-scheme" content="dark">
  <title>CTF Arena Replays</title>
  <meta name="description" content="Turn-by-turn replays of AI agents playing capture the flag. 逐回合复盘 AI 智能体的夺旗对决。">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/lobby.css">
  <link rel="preload" href="data/catalog.json" as="fetch" crossorigin>
  <script type="module" src="assets/js/lobby/main.js"></script>
  <script>
    // Opened straight from disk: browsers block ES modules on file:// pages.
    if (location.protocol === 'file:') {
      document.addEventListener('DOMContentLoaded', function () {
        var n = document.createElement('div');
        n.className = 'file-notice';
        n.innerHTML = '<strong>请通过本地服务器打开 / Open this site through a local server</strong>'
          + '<p>在项目目录运行 / In the project folder run: <code>python3 tools/serve.py</code></p>'
          + '<p>然后访问 / then open <code>http://localhost:8000</code></p>';
        document.body.prepend(n);
      });
    }
  </script>
</head>
<body class="page-lobby">
  <a class="skip-link" href="#matches" data-i18n="lobby.skipToMatches"></a>

  <header class="site-header">
    <a class="brand" href="index.html">
      <img class="brand__mark" src="favicon.svg" width="28" height="28" alt="">
      <span class="brand__name" data-i18n="site.name"></span>
    </a>
    <nav class="site-nav">
      <div id="lang-switch"></div>
      <a class="icon-btn" href="https://github.com/Casper015/ctf-replay-viewer" target="_blank" rel="noopener" data-i18n-attr="aria-label:lobby.github,title:lobby.github"><span data-icon="github"></span></a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <div class="hero__copy">
        <h1 class="hero__title" data-i18n="lobby.heroTitle"></h1>
        <p class="hero__lede" id="hero-lede"></p>
        <div class="hero__actions">
          <a class="btn btn--primary" id="hero-watch" href="match.html"><span data-icon="play" class="icon icon--sm"></span><span data-i18n="lobby.watchFeatured"></span></a>
          <a class="btn btn--ghost" id="hero-browse" href="#matches"></a>
        </div>
      </div>

      <figure class="hero__stage">
        <a class="hero__board" id="hero-board-link" href="match.html">
          <canvas id="hero-board" aria-hidden="true"></canvas>
          <span class="hero__hud" id="hero-hud"></span>
          <span class="hero__hint" data-i18n="lobby.heroBoardHint"></span>
        </a>
        <figcaption class="hero__caption" id="hero-caption"></figcaption>
      </figure>
    </section>

    <section class="matches" id="matches" aria-labelledby="matches-title">
      <div class="matches__head">
        <h2 class="matches__title" id="matches-title" data-i18n="lobby.matchesTitle"></h2>
        <div class="matches__tools">
          <div class="segmented filters" id="filters" role="group" data-i18n-attr="aria-label:lobby.filterLabel"></div>
          <label class="search">
            <span data-icon="search" class="icon icon--sm"></span>
            <input id="search" type="search" autocomplete="off" spellcheck="false" data-i18n-attr="placeholder:lobby.searchPlaceholder,aria-label:lobby.search">
          </label>
        </div>
      </div>
      <ol class="match-list" id="match-list" aria-live="polite"></ol>
      <div class="notice" id="list-empty" hidden>
        <h3 data-i18n="lobby.emptyTitle"></h3>
        <p data-i18n="lobby.emptyBody"></p>
        <button class="btn btn--ghost" type="button" id="clear-filters" data-i18n="lobby.clearFilters"></button>
      </div>
      <div class="notice" id="list-status" role="status"><div class="spinner" aria-hidden="true"></div></div>
    </section>

    <section class="legend" aria-labelledby="legend-title">
      <h2 class="legend__title" id="legend-title" data-i18n="lobby.legendTitle"></h2>
      <ul class="legend__grid" id="legend"></ul>
    </section>
  </main>

  <footer class="site-footer">
    <p data-i18n="lobby.footer"></p>
    <a href="https://github.com/Casper015/ctf-replay-viewer" target="_blank" rel="noopener" data-i18n="lobby.github"></a>
  </footer>
</body>
</html>
