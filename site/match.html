<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c1029">
  <meta name="color-scheme" content="dark">
  <title>CTF Arena Replays</title>
  <meta name="description" content="Turn-by-turn replay of an AI capture-the-flag match. 逐回合 AI 夺旗对局复盘。">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/viewer.css">
  <link rel="modulepreload" href="assets/js/viewer/main.js">
  <script type="module" src="assets/js/viewer/main.js"></script>
  <script>
    // Opened straight from disk: browsers block ES modules on file:// pages.
    if (location.protocol === 'file:') {
      document.addEventListener('DOMContentLoaded', function () {
        var n = document.createElement('div');
        n.className = 'file-notice';
        n.innerHTML = '<strong>请通过本地服务器打开 / Open this site through a local server</strong>'
          + '<p>在项目目录运行 / In the project folder run: <code>python3 tools/serve.py</code></p>'
          + '<p>然后访问 / then open <code>http://localhost:8000</code></p>';
        document.body.prepend(n);
      });
    }
  </script>
</head>
<body class="page-viewer">
  <a class="skip-link" href="#board" data-i18n="viewer.skipToBoard"></a>

  <div class="viewer" id="viewer" data-state="loading">
    <header class="topbar">
      <a class="icon-btn" href="index.html" data-i18n-attr="aria-label:viewer.back,title:viewer.back"><span data-icon="arrowLeft"></span></a>
      <div class="topbar__title">
        <h1 id="match-title" class="topbar__h1"></h1>
        <div class="topbar__meta" id="match-meta"></div>
      </div>
      <div class="topbar__actions">
        <button class="icon-btn" id="btn-matches" type="button" data-i18n-attr="aria-label:viewer.otherMatches,title:viewer.otherMatches"><span data-icon="list"></span></button>
        <button class="icon-btn hide-touch" id="btn-shortcuts" type="button" data-i18n-attr="aria-label:viewer.shortcuts,title:viewer.shortcuts"><span data-icon="keyboard"></span></button>
        <div id="lang-switch"></div>
        <button class="icon-btn" id="btn-immersive" type="button" aria-pressed="false"></button>
      </div>
    </header>

    <main class="stage" id="main">
      <section class="board-area">
        <div class="board-frame" id="board-frame">
          <canvas id="board" class="board-canvas" tabindex="-1"></canvas>

          <div class="board-hud">
            <div class="hud-pill" id="hud-turn"></div>
            <div class="hud-pill" id="hud-leader"></div>
          </div>

          <div class="board-tools" role="group" data-i18n-attr="aria-label:viewer.zoomTools">
            <button class="icon-btn icon-btn--glass" id="zoom-in" type="button" data-i18n-attr="aria-label:viewer.zoomIn,title:viewer.zoomIn"><span data-icon="zoomIn"></span></button>
            <button class="icon-btn icon-btn--glass" id="zoom-out" type="button" data-i18n-attr="aria-label:viewer.zoomOut,title:viewer.zoomOut"><span data-icon="zoomOut"></span></button>
            <button class="icon-btn icon-btn--glass" id="zoom-fit" type="button" data-i18n-attr="aria-label:viewer.zoomFit,title:viewer.zoomFit"><span data-icon="fit"></span></button>
            <button class="icon-btn icon-btn--glass" id="btn-exit-immersive" type="button" data-i18n-attr="aria-label:viewer.exitImmersive,title:viewer.exitImmersive"><span data-icon="minimize"></span></button>
          </div>

          <div class="unit-card" id="unit-card" hidden aria-live="polite"></div>
          <div class="board-tip" id="board-tip" hidden></div>
          <div class="board-status" id="board-status" role="status"></div>
        </div>
      </section>

      <section class="transport" data-i18n-attr="aria-label:viewer.playback">
        <button class="transport__play" id="btn-play" type="button"></button>
        <button class="icon-btn" id="btn-step-back" type="button"></button>
        <button class="icon-btn" id="btn-step-fwd" type="button"></button>
        <div class="scrubber" id="scrubber">
          <div class="scrubber__track"><div class="scrubber__fill"></div></div>
          <div class="scrubber__marks" id="scrub-marks"></div>
          <input class="scrubber__input" id="scrub" type="range" min="0" max="400" step="1" value="0">
        </div>
        <output class="transport__time" id="time" for="scrub"></output>
        <select class="select transport__speed" id="speed"></select>
      </section>

      <aside class="rail">
        <div class="scorebug" id="scorebug" aria-live="off"></div>
        <div class="tabs segmented" id="tabs" role="tablist" data-i18n-attr="aria-label:tabs.label">
          <button role="tab" id="tab-standings" data-tab="standings" aria-controls="pane-standings" type="button"><span data-icon="podium" class="icon icon--sm"></span><span data-i18n="tabs.standings"></span></button>
          <button role="tab" id="tab-chart" data-tab="chart" aria-controls="pane-chart" type="button"><span data-icon="chart" class="icon icon--sm"></span><span data-i18n="tabs.chart"></span></button>
          <button role="tab" id="tab-feed" data-tab="feed" aria-controls="pane-feed" type="button"><span data-icon="activity" class="icon icon--sm"></span><span data-i18n="tabs.feed"></span></button>
          <button role="tab" id="tab-stats" data-tab="stats" aria-controls="pane-stats" type="button"><span data-icon="table" class="icon icon--sm"></span><span data-i18n="tabs.stats"></span></button>
        </div>
        <div class="panes">
          <section class="pane" id="pane-standings" role="tabpanel" aria-labelledby="tab-standings"></section>
          <section class="pane" id="pane-chart" role="tabpanel" aria-labelledby="tab-chart" hidden></section>
          <section class="pane" id="pane-feed" role="tabpanel" aria-labelledby="tab-feed" hidden></section>
          <section class="pane" id="pane-stats" role="tabpanel" aria-labelledby="tab-stats" hidden></section>
        </div>
      </aside>
    </main>
  </div>

  <dialog class="dialog" id="dlg-matches" aria-labelledby="dlg-matches-title">
    <div class="dialog__head">
      <h2 id="dlg-matches-title" data-i18n="viewer.otherMatches"></h2>
      <button class="icon-btn" type="button" data-close data-i18n-attr="aria-label:common.close"><span data-icon="x"></span></button>
    </div>
    <ol class="dialog__body picker" id="matches-list"></ol>
  </dialog>

  <dialog class="dialog" id="dlg-shortcuts" aria-labelledby="dlg-shortcuts-title">
    <div class="dialog__head">
      <h2 id="dlg-shortcuts-title" data-i18n="viewer.shortcuts"></h2>
      <button class="icon-btn" type="button" data-close data-i18n-attr="aria-label:common.close"><span data-icon="x"></span></button>
    </div>
    <dl class="dialog__body shortcuts">
      <div><dt><kbd>Space</kbd></dt><dd data-i18n="keys.play"></dd></div>
      <div><dt><kbd>←</kbd> <kbd>→</kbd></dt><dd data-i18n="keys.step"></dd></div>
      <div><dt><kbd>Shift</kbd> + <kbd>←</kbd> <kbd>→</kbd></dt><dd data-i18n="keys.step10"></dd></div>
      <div><dt><kbd>,</kbd> <kbd>.</kbd></dt><dd data-i18n="keys.capture"></dd></div>
      <div><dt><kbd>Home</kbd> <kbd>End</kbd></dt><dd data-i18n="keys.ends"></dd></div>
      <div><dt><kbd>[</kbd> <kbd>]</kbd></dt><dd data-i18n="keys.speed"></dd></div>
      <div><dt><kbd>+</kbd> <kbd>-</kbd> <kbd>0</kbd></dt><dd data-i18n="keys.zoom"></dd></div>
      <div><dt><kbd>1</kbd>–<kbd>4</kbd></dt><dd data-i18n="keys.tabs"></dd></div>
      <div><dt><kbd>F</kbd></dt><dd data-i18n="keys.immersive"></dd></div>
      <div><dt><kbd>Esc</kbd></dt><dd data-i18n="keys.escape"></dd></div>
    </dl>
  </dialog>
</body>
</html>
