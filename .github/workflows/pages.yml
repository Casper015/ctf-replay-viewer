name: Check and deploy to GitHub Pages

# Pull requests: run the checks only.
# Pushes to main: run the checks, then publish the site/ folder.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Never cancel a deploy halfway; superseded PR runs can go
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check data and site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate match metadata and replays
        run: python3 tools/build_catalog.py --check

      - name: Catalog is up to date
        run: |
          python3 tools/build_catalog.py
          if ! git diff --quiet -- site/; then
            echo "::error::Generated files in site/ are out of date. Run: python3 tools/build_catalog.py and commit the result."
            git diff --stat -- site/
            exit 1
          fi

      - name: Check site (i18n keys, imports, icons, links)
        run: node tools/check.mjs

      - name: Upload site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
