name: Deploy CTF Replay Viewer & Match Lobby to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Assemble GitHub Pages site
        run: |
          mkdir -p _site
          # 复制所有主 HTML 页面 (包括 index.html, lobby.html, 所有 match_*.html 与 replay_*.html)
          cp *.html _site/
          cp all_replays_data.json _site/ 2>/dev/null || true
          touch _site/.nojekyll
          # 同时挂载 docs 子目录，保证根路径与 /docs 路径无论哪种部署模式均 100% 正常访问
          mkdir -p _site/docs
          cp docs/*.html _site/docs/ 2>/dev/null || true
          touch _site/docs/.nojekyll
          echo "=== Deployed root files ==="
          ls -la _site
          echo "=== Deployed docs files ==="
          ls -la _site/docs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
